const api = {
  getUser: async (name) => {
    const r = await fetch(`${SB_URL}/users?name=eq.${encodeURIComponent(name)}&limit=1`, { headers: SB_H })
    const d = await r.json()
    return d.length ? d[0] : null
  },
  createUser: async (data) => {
    const r = await fetch(`${SB_URL}/users`, { method:'POST', headers:{...SB_H,'Prefer':'return=representation'}, body:JSON.stringify(data) })
    const d = await r.json()
    if (!r.ok) throw new Error(JSON.stringify(d))
    return Array.isArray(d) ? d[0] : d
  },
  updateUser: async (data) => {
    const r = await fetch(`${SB_URL}/users?name=eq.${encodeURIComponent(data.name)}`, { method:'PATCH', headers:{...SB_H,'Prefer':'return=representation'}, body:JSON.stringify(data) })
    const d = await r.json()
    if (!r.ok) throw new Error(JSON.stringify(d))
    return Array.isArray(d) ? d[0] : data
  },
  getGroup: async (code) => {
    const r = await fetch(`${SB_URL}/groups?code=eq.${encodeURIComponent(code.toUpperCase())}&limit=1`, { headers: SB_H })
    const d = await r.json()
    return d.length ? d[0] : null

  createGroup: async (data) => {

// ── AUTH ──────────────────────────────────────────────────────────────
function Auth({onLogin}){
  const [name,setName]=useState('')
  const [pin,setPin]=useState('')
  const [err,setErr]=useState('')
  const [loading,setLoading]=useState(false)
  const go=async()=>{
    if(!name.trim()){setErr('what do we call you? 🌸');return}
    if(pin.length<4){setErr('PIN needs 4 digits 🔒');return}
    setLoading(true);setErr('')
    const result = await onLogin(name.trim().toLowerCase(),pin)
    if(!result)setErr('wrong PIN babe 💅')
    setLoading(false)
  }
  return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#fff',padding:'2rem'}}>

        {step===2&&<div className="fu">

          </div>
          <div style={{display:'flex',gap:'7px',marginBottom:'11px'}}>
            <Input value={nh} onChange={setNh} onEnter={addH} placeholder="add your own..." style={{border:`1.5px solid ${nh?c.c:'rgba(180,140,165,0.35)'}`}}/>
            <button onClick={addH} style={{padding:'0 13px',borderRadius:'10px',background:c.c,color:'white',fontWeight:'900',fontSize:'13px',border:'none',flexShrink:0}}>add</button>
          </div>
          {habits.length>0&&<div style={{background:c.l,border:`1px solid ${c.m}`,borderRadius:'11px',padding:'9px 13px',marginBottom:'11px'}}>
            <div style={{fontSize:'10px',fontWeight:'700',color:c.c,textTransform:'uppercase',letterSpacing:'1px',marginBottom:'5px'}}>your habits ({habits.length})</div>
            {habits.map(h=><div key={h.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'3px 0'}}>
              <span style={{fontSize:'12px',color:'#1A1220'}}>• {h.text}</span>
              <button onClick={()=>setHabits(p=>p.filter(x=>x.id!==h.id))} style={{color:'#A898B0',fontSize:'12px',background:'none',border:'none',cursor:'pointer'}}>✕</button>
            </div>)}
          </div>}
          <div style={{display:'flex',gap:'10px'}}>
            <button onClick={()=>setStep(4)} style={{flex:1,padding:'11px',borderRadius:'12px',border:`2px solid ${c.c}`,color:c.c,fontWeight:'700',background:'white',cursor:'pointer'}}>back</button>
            <button onClick={()=>setStep(6)} disabled={habits.length===0} style={{flex:2,padding:'11px',borderRadius:'12px',background:habits.length>0?c.c:'#E0D0D8',color:'white',fontWeight:'900',border:'none',cursor:habits.length>0?'pointer':'not-allowed'}}>{habits.length>0?`${habits.length} habits locked →`:'pick at least one'}</button>
          </div>
        </div>}

        {step===6&&<div className="fu">
          <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'24px',color:'#1A1220',marginBottom:'4px'}}>your goals 🎯</h2>
          <p style={{color:'#A898B0',fontSize:'12px',marginBottom:'1rem'}}>the bigger picture behind your habits</p>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'11px'}}>
            {EX_GOALS.map(g=>{const s=goals.includes(g);return(
              <button key={g} onClick={()=>setGoals(p=>s?p.filter(x=>x!==g):[...p,g])} style={{padding:'6px 11px',borderRadius:'20px',fontSize:'12px',fontWeight:'700',border:`2px solid ${s?c.c:'#E0D0D8'}`,background:s?c.l:'white',color:s?c.c:'#6B5870',cursor:'pointer',transition:'all 0.15s'}}>{s?'✓ ':'+ '}{g}</button>
            )})}
          </div>
          <div style={{display:'flex',gap:'7px',marginBottom:'11px'}}>
            <Input value={ng} onChange={setNg} onEnter={addG} placeholder="add your own goal..." style={{border:`1.5px solid ${ng?c.c:'rgba(180,140,165,0.35)'}`}}/>
            <button onClick={addG} style={{padding:'0 13px',borderRadius:'10px',background:c.c,color:'white',fontWeight:'900',fontSize:'13px',border:'none',flexShrink:0}}>add</button>
          </div>
          <div style={{background:'#F9F5F7',borderRadius:'13px',padding:'13px',marginBottom:'11px'}}>
            <div style={{fontSize:'12px',fontWeight:'700',color:'#1A1220',marginBottom:'7px'}}>want a no-media challenge? 📵</div>
            <div style={{display:'flex',gap:'7px'}}>
              <button onClick={()=>setWMedia(true)} style={{flex:1,padding:'8px',borderRadius:'9px',border:`2px solid ${wMedia===true?c.c:'#E0D0D8'}`,background:wMedia===true?c.l:'white',color:wMedia===true?c.c:'#6B5870',fontWeight:'700',fontSize:'12px',cursor:'pointer'}}>yes! 📴</button>
              <button onClick={()=>setWMedia(false)} style={{flex:1,padding:'8px',borderRadius:'9px',border:`2px solid ${wMedia===false?c.c:'#E0D0D8'}`,background:wMedia===false?c.l:'white',color:wMedia===false?c.c:'#6B5870',fontWeight:'700',fontSize:'12px',cursor:'pointer'}}>not for me</button>
            </div>
          </div>
          <div style={{display:'flex',gap:'10px'}}>
            <button onClick={()=>setStep(5)} style={{flex:1,padding:'11px',borderRadius:'12px',border:`2px solid ${c.c}`,color:c.c,fontWeight:'700',background:'white',cursor:'pointer'}}>back</button>
            <button onClick={wMedia?()=>setStep(7):finish} disabled={goals.length===0||wMedia===null||saving} style={{flex:2,padding:'11px',borderRadius:'12px',background:(goals.length>0&&wMedia!==null)?c.c:'#E0D0D8',color:'white',fontWeight:'900',border:'none',cursor:(goals.length>0&&wMedia!==null)?'pointer':'not-allowed',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>
              {saving?<><Spinner color="white"/> saving...</>:wMedia?'set media rules →':"i'm ready! 🔥"}
            </button>
          </div>
        </div>}

        {step===7&&<div className="fu">
          <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'24px',color:'#1A1220',marginBottom:'4px'}}>media rules 📵</h2>
          <p style={{color:'#A898B0',fontSize:'12px',marginBottom:'1rem'}}>set your own rules for each day — tap to edit</p>
          <div style={{background:'white',borderRadius:'13px',border:'1px solid #F0E8ED',overflow:'hidden',marginBottom:'1rem'}}>
            {media.map((r,i)=>(
              <div key={r.day} style={{display:'flex',alignItems:'center',gap:'9px',padding:'10px 13px',borderBottom:i<6?'1px solid #F0E8ED':'none'}}>
                <input value={r.emoji} onChange={e=>setMedia(p=>p.map((x,j)=>j===i?{...x,emoji:e.target.value}:x))} style={{width:'34px',padding:'3px',borderRadius:'6px',border:'1px solid #E0D0D8',fontSize:'15px',textAlign:'center',outline:'none'}}/>
                <div style={{fontSize:'10px',fontWeight:'700',color:'#A898B0',width:'26px'}}>{r.day}</div>
                <input value={r.rule} onChange={e=>setMedia(p=>p.map((x,j)=>j===i?{...x,rule:e.target.value}:x))} style={{flex:1,padding:'5px 9px',borderRadius:'7px',border:'1px solid #E0D0D8',fontSize:'12px',outline:'none',fontFamily:'DM Sans,sans-serif'}}/>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:'10px'}}>
            <button onClick={()=>setStep(6)} style={{flex:1,padding:'11px',borderRadius:'12px',border:`2px solid ${c.c}`,color:c.c,fontWeight:'700',background:'white',cursor:'pointer'}}>back</button>
            <button onClick={finish} disabled={saving} style={{flex:2,padding:'11px',borderRadius:'12px',background:c.c,color:'white',fontWeight:'900',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>
              {saving?<><Spinner color="white"/> saving your profile...</>:"i'm ready! 🔥"}
            </button>
            {saving&&<div style={{fontSize:'12px',color:'#A898B0',textAlign:'center',marginTop:'8px'}}>this may take a few seconds...</div>}
          </div>
        </div>}
      </div>
    </div>
  )
}

// ── HOME ──────────────────────────────────────────────────────────────
function Home({u,me,setU,logout}){
  const [tab,setTab]=useState(()=>{
    try{
      const s=localStorage.getItem('ms_session')
      if(s)return JSON.parse(s).tab||'today'
    }catch{}
    return 'today'
  })
  const [ms,setMs]=useState(null)
  const [groups,setGroups]=useState([])
  const [groupRefreshKey,setGroupRefreshKey]=useState(0)

  useEffect(()=>{
    if(!u?.day)return
    try{
      const seen=JSON.parse(localStorage.getItem('ms_'+me)||'[]')
      const m=MILESTONES.find(x=>x.day===u.day&&!seen.includes(x.day))
      if(m){setMs(m);localStorage.setItem('ms_'+me,JSON.stringify([...seen,m.day]))}
    }catch{}
  },[u?.day])

  const [quote,setQuote]=useState(null)
  const [weeklySummary,setWeeklySummary]=useState(null)
  const [showProfile,setShowProfile]=useState(false)
  useEffect(()=>{
    if(!u)return
    const today=new Date().toDateString()
    const lastQuote=localStorage.getItem('quote_date_'+me)
    if(lastQuote===today)return  // already shown today
    const QUOTES=[
      "you are becoming the person you've always wanted to be 🌸",
      "every day you show up is a day you choose yourself 💜",
      "progress over perfection, always ✨",
      "you are stronger than you know 🔥",
      "small steps every day lead to big changes 🌱",
      "your consistency is your superpower 💎",
      "today is another chance to be intentional 🌟",
      "you deserve the life you're building 👑",
      "rest if you must, but don't you quit 💪",
      "the version of you 75 days from now will thank you 🌷",
      "you are not behind. you are exactly where you need to be ✨",
      "choosing yourself every day is the most powerful thing you can do 🌸",
      "your future self is cheering you on right now 🎉",
      "be patient with yourself. growth takes time 🌱",
      "you've got this. you always have 💜",
    ]
    const q=QUOTES[Math.floor(Math.random()*QUOTES.length)]
    setQuote(q)
    localStorage.setItem('quote_date_'+me,today)
    setTimeout(()=>setQuote(null),8000)
  },[u?.name])

  // Weekly summary - show every Sunday
  useEffect(()=>{
    if(!u)return
    const now=new Date()
    if(now.getDay()!==0)return // only Sunday
    const thisWeek='week_'+now.toDateString()
    if(localStorage.getItem('ws_'+me)===thisWeek)return
    // Calculate week stats
    const checkins=u.checkins||{}
    const days=[]
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d.toDateString())}
    const checkedDays=days.filter(d=>checkins[d])
    const totalHabits=(u.tasks?.daily||[]).length
    const avgCompletion=checkedDays.length>0?Math.round(checkedDays.reduce((sum,d)=>{
      const done=checkins[d]||{}
      return sum+(Object.values(done).filter(Boolean).length/Math.max(totalHabits,1))
    },0)/checkedDays.length*100):0
    setWeeklySummary({checkedDays:checkedDays.length,avgCompletion,streak:0,day:u.day||1})
    localStorage.setItem('ws_'+me,thisWeek)
  },[u?.name])

  const loadGroups=useCallback(async()=>{
    if(!u?.groups?.length)return
    const gs=await Promise.all(u.groups.map(code=>api.getGroup(code).catch(()=>null)))
    setGroups(gs.filter(Boolean))
  },[u?.groups?.length, groupRefreshKey])

  useEffect(()=>{loadGroups()},[loadGroups])

  const refreshGroups=()=>setGroupRefreshKey(k=>k+1)

  const save=async(updates)=>{
    const updated={...u,...updates}
    setU(updated)
    // Update localStorage cache immediately so refresh doesn't lose data
    try{
      const session=localStorage.getItem('ms_session')
      if(session){
        const s=JSON.parse(session)
        localStorage.setItem('ms_session',JSON.stringify({...s,user:updated,lastDay:new Date().toDateString()}))
      }
    }catch{}
    await api.updateUser(updated)
  }

  const checkin=async(date,done)=>{
    const checkins={...(u.checkins||{}),[date]:done}
    const newDay=(u.day||1)+1
    await save({checkins,day:newDay,last_checkin:date})
    // post to all groups
    for(const g of groups){
      const post={id:Date.now()+Math.random(),user:me,type:'checkin',content:{day:u.day,done:Object.values(done).filter(Boolean).length,total:Object.keys(done).length,text:`just checked in for day ${u.day}! 🔥`},ts:Date.now(),hearts:[],affirmations:[]}
      const updated={...g,feed:[post,...(g.feed||[]).slice(0,49)]}
      await api.updateGroup(updated)
    }
    loadGroups()
  }

  const mkGroup=async(name)=>{
    const code=Math.random().toString(36).slice(2,7).toUpperCase()
    const g={code,name,members:[me],feed:[]}
    await api.createGroup(g)
    const newGroups=[...(u.groups||[]),code]
    await save({groups:newGroups})
    loadGroups()
    return code
  }

  const joinGrp=async(code)=>{
    const g=await api.getGroup(code.toUpperCase())
    if(!g)return false
    const updated={...g,members:[...new Set([...g.members,me])]}
    await api.updateGroup(updated)
    const newGroups=[...new Set([...(u.groups||[]),code.toUpperCase()])]
    await save({groups:newGroups})
    setGroupRefreshKey(k=>k+1)
    return true
  }

  const deleteGrp=async(code)=>{
    // Remove from user's groups list
    const newGroups=(u.groups||[]).filter(c=>c!==code)
    await save({groups:newGroups})
    // If we created it, delete from Supabase entirely
    const g=groups.find(x=>x.code===code)
    if(g?.created_by===me)await api.deleteGroup(code)
    setGroupRefreshKey(k=>k+1)
  }

  const postFeed=async(code,type,content)=>{
    // Always fetch fresh to avoid overwriting other members' posts
    const g=await api.getGroup(code)||groups.find(x=>x.code===code)
    if(!g)return
    const post={id:Date.now()+Math.random(),user:me,type,content,ts:Date.now(),hearts:[],affirmations:[]}
    const updated={...g,feed:[post,...(g.feed||[]).slice(0,49)]}
    await api.updateGroup(updated)
    await loadGroups()
  }

  const heartPost=async(code,pid)=>{
    const g=await api.getGroup(code)||groups.find(x=>x.code===code)
    if(!g)return
    const feed=(g.feed||[]).map(p=>{
      if(p.id!==pid)return p
      const hearts=(p.hearts||[]).includes(me)?p.hearts.filter(x=>x!==me):[...p.hearts,me]
      return{...p,hearts}
    })
    await api.updateGroup({...g,feed})
    await loadGroups()
  }

  const affirmPost=async(code,pid,text)=>{
    const g=await api.getGroup(code)||groups.find(x=>x.code===code)
    if(!g)return
    const feed=(g.feed||[]).map(p=>{
      if(p.id!==pid)return p
      return{...p,affirmations:[...(p.affirmations||[]),{user:me,text,ts:Date.now()}]}
    })
    await api.updateGroup({...g,feed})
    await loadGroups()
  }

  if(!u)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><Spinner/></div>
  const c=u.color||'#B5365F'
  const tabs=[{id:'today',icon:'ti-sun',lbl:'today'},{id:'goals',icon:'ti-target',lbl:'goals'},{id:'media',icon:'ti-device-mobile-off',lbl:'media'},{id:'tasks',icon:'ti-list-check',lbl:'tasks'},{id:'nourish',icon:'ti-salad',lbl:'nourish'},{id:'group',icon:'ti-users',lbl:'squad'}]

  return(
    <div style={{display:'flex',flexDirection:'column',minHeight:'100vh',maxWidth:'480px',margin:'0 auto',background:'#fff'}}>
      <div style={{background:'white',padding:'14px 18px 10px',borderBottom:'1px solid rgba(180,140,165,0.18)',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:100}}>
        <div>
          <div style={{fontFamily:'Playfair Display,serif',fontSize:'19px',color:c,fontWeight:'700'}}>magical sunshine 🌸</div>
          <button onClick={()=>setShowProfile(true)} style={{fontSize:'11px',color:'#A898B0',background:'none',border:'none',cursor:'pointer',padding:0,textAlign:'left',display:'flex',alignItems:'center',gap:'4px'}}>
            hey {u.name} · day {u.day||1} of {u.total_days||75} <i className="ti ti-chevron-down" style={{fontSize:'10px'}}/>
          </button>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <div style={{background:c,color:'white',borderRadius:'20px',padding:'4px 11px',fontSize:'11px',fontWeight:'700'}}>🔥 {u.day||1}/{u.total_days||75}</div>
          <button onClick={logout} style={{color:'#A898B0',background:'none',border:'none',cursor:'pointer'}}><i className="ti ti-logout" style={{fontSize:'18px'}}/></button>
        </div>
      </div>
      <div style={{height:'3px',background:'rgba(180,140,165,0.15)'}}>
        <div style={{height:'100%',background:`linear-gradient(90deg,${c},#FF6B4A,#FFB830)`,width:`${Math.min(100,((u.day||1)/(u.total_days||75))*100)}%`,transition:'width 0.5s'}}/>
      </div>
      <div id="scroll-container" style={{flex:1,overflowY:'auto',paddingBottom:'80px'}}>
        {tab==='today'&&<Today u={u} me={me} save={save} checkin={checkin} groups={groups}/>}
        {tab==='goals'&&<Goals u={u} save={save}/>}
        {tab==='media'&&<Media u={u} save={save}/>}
        {tab==='tasks'&&<Tasks u={u} save={save}/>}
        {tab==='nourish'&&<Nourish u={u} me={me} save={save}/>}
        {tab==='group'&&<Squad u={u} me={me} groups={groups} mkGroup={mkGroup} joinGroup={joinGrp} deleteGroup={deleteGrp} heart={heartPost} affirm={affirmPost} postFeed={postFeed} refreshGroups={refreshGroups}/>}
      </div>
      <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:'480px',background:'white',borderTop:'1px solid rgba(180,140,165,0.18)',display:'flex',padding:'8px 0',zIndex:100}}>
        {tabs.map(t=><button key={t.id} onClick={()=>{setTab(t.id);document.querySelector('#scroll-container')?.scrollTo({top:0,behavior:'smooth'});try{const s=localStorage.getItem('ms_session');if(s){const p=JSON.parse(s);localStorage.setItem('ms_session',JSON.stringify({...p,tab:t.id,lastDay:new Date().toDateString()}))}}catch{}}} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',padding:'3px 0',background:'none',border:'none',cursor:'pointer',color:tab===t.id?c:c+'88',transition:'color 0.15s'}}>
          <i className={`ti ${t.icon}`} style={{fontSize:'22px'}}/>
          <span style={{fontSize:'11px',fontWeight:'900',letterSpacing:'0.2px'}}>{t.lbl}</span>
          <div style={{width:'4px',height:'4px',borderRadius:'50%',background:c,opacity:tab===t.id?1:0,transition:'opacity 0.15s'}}/>
        </button>)}
      </div>
      {showProfile&&<ProfileModal u={u} me={me} save={save} onClose={()=>setShowProfile(false)}/>}
      {weeklySummary&&<div style={{position:'fixed',inset:0,zIndex:150,background:'rgba(20,10,30,0.5)',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px'}} onClick={()=>setWeeklySummary(null)}>
        <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'22px',padding:'28px 24px',maxWidth:'320px',width:'100%',boxShadow:'0 12px 48px rgba(181,54,95,0.25)',textAlign:'center'}}>
          <div style={{fontSize:'40px',marginBottom:'10px'}}>📊</div>
          <div style={{fontFamily:'Playfair Display,serif',fontSize:'22px',color:'#1A1220',marginBottom:'4px'}}>weekly recap ✨</div>
          <div style={{fontSize:'12px',color:'#A898B0',marginBottom:'20px'}}>here's how your week went</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'20px'}}>
            <div style={{background:'#FDF0F5',borderRadius:'13px',padding:'13px'}}>
              <div style={{fontSize:'28px',fontWeight:'900',color:'#B5365F'}}>{weeklySummary.checkedDays}<span style={{fontSize:'14px'}}>/7</span></div>
              <div style={{fontSize:'11px',color:'#A898B0',marginTop:'2px'}}>days checked in</div>
            </div>
            <div style={{background:'#EDFBF3',borderRadius:'13px',padding:'13px'}}>
              <div style={{fontSize:'28px',fontWeight:'900',color:'#1E6E44'}}>{weeklySummary.avgCompletion}<span style={{fontSize:'14px'}}>%</span></div>
              <div style={{fontSize:'11px',color:'#A898B0',marginTop:'2px'}}>avg completion</div>
            </div>
            <div style={{background:'linear-gradient(135deg,#FF6B4A22,#FFB83022)',borderRadius:'13px',padding:'13px',gridColumn:'1/-1'}}>
              <div style={{fontSize:'28px',fontWeight:'900',color:'#FF6B4A'}}>day {weeklySummary.day} 🔥</div>
              <div style={{fontSize:'11px',color:'#A898B0',marginTop:'2px'}}>of your challenge</div>
            </div>
          </div>
          <div style={{fontSize:'13px',color:'#6B5870',marginBottom:'20px',lineHeight:1.6}}>
            {weeklySummary.checkedDays>=6?'incredible week! you showed up every single day 👑':weeklySummary.checkedDays>=4?'solid week babe! keep that momentum going 🔥':weeklySummary.checkedDays>=2?'every check-in counts. new week, fresh start 🌸':'a new week is a new chance. you got this 💜'}
          </div>
          <button onClick={()=>setWeeklySummary(null)} style={{width:'100%',padding:'12px',borderRadius:'12px',background:c,color:'white',fontWeight:'900',fontSize:'14px',border:'none',cursor:'pointer'}}>let's have a great week 🌸</button>
        </div>
      </div>}
      {quote&&<div style={{position:'fixed',inset:0,zIndex:150,background:'rgba(20,10,30,0.45)',display:'flex',alignItems:'center',justifyContent:'center',padding:'24px'}} onClick={()=>setQuote(null)}>
        <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'22px',padding:'28px 24px',maxWidth:'320px',width:'100%',boxShadow:'0 12px 48px rgba(181,54,95,0.25)',border:'1px solid #F4ADCA',textAlign:'center',animation:'fadeUp 0.4s ease'}}>
          <div style={{fontSize:'32px',marginBottom:'10px'}}>🌸</div>
          <div style={{fontSize:'12px',fontWeight:'700',color:'#B5365F',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'8px'}}>good morning ✨</div>
          <div style={{fontSize:'16px',color:'#6B5870',lineHeight:1.7,fontStyle:'italic',marginBottom:'20px'}}>"{quote}"</div>
          <button onClick={()=>setQuote(null)} style={{background:'#B5365F',color:'white',borderRadius:'12px',padding:'10px 28px',fontWeight:'900',fontSize:'14px',border:'none',cursor:'pointer'}}>let's do this 🔥</button>
        </div>
      </div>}
      {ms&&<div style={{position:'fixed',inset:0,zIndex:200,background:'rgba(20,10,30,0.6)',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}} onClick={()=>setMs(null)}>
        <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'22px',padding:'28px 22px',textAlign:'center',maxWidth:'300px',width:'100%',boxShadow:'0 20px 60px rgba(181,54,95,0.3)'}}>
          <div style={{fontSize:'56px',marginBottom:'10px'}}>{ms.emoji}</div>
          <div style={{fontFamily:'Playfair Display,serif',fontSize:'24px',fontWeight:'700',color:c,marginBottom:'8px'}}>{ms.title}</div>
          <div style={{fontSize:'14px',color:'#6B5870',lineHeight:1.6,marginBottom:'20px'}}>{ms.msg}</div>
          <button onClick={()=>setMs(null)} style={{width:'100%',padding:'12px',borderRadius:'12px',background:c,color:'white',fontSize:'14px',fontWeight:'900',border:'none',cursor:'pointer',marginBottom:'8px'}}>let's keep going 🔥</button>
          {groups.length>0&&<button onClick={async()=>{
            for(const g of groups){
              await postToFeed(g.code,'milestone',{text:`just hit a milestone: ${ms.title} ${ms.emoji} — day ${u.day||1} of ${u.total_days||75}!`,milestone:ms.title,emoji:ms.emoji})
            }
            setMs(null)
          }} style={{width:'100%',padding:'10px',borderRadius:'12px',border:`2px solid ${c}`,color:c,fontSize:'13px',fontWeight:'700',background:'white',cursor:'pointer'}}>share to squad 📣</button>}
        </div>
      </div>}
    </div>
  )
}

// ── TODAY ─────────────────────────────────────────────────────────────
function Today({u,me,save,checkin,groups}){
  const today=new Date().toDateString()
  const done=(u.checkins||{})[today]||{}
  const alreadyIn=u.last_checkin===today
  const [ok,setOk]=useState(false)
  const dateStr=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})

  const [nh,setNh]=useState('')
  const [editHabit,setEditHabit]=useState(null)
  const [editText,setEditText]=useState('')
  const c=u.color||'#B5365F'
  const habits=(u.tasks?.daily)||[]
  const mediaRule=(u.media_rules||[]).find(r=>r.day===TODAY_DAY)
  const doneCount=Object.values(done).filter(Boolean).length
  const total=habits.length+(mediaRule?1:0)

  const toggle=id=>{
    const nd={...done,[id]:!done[id]}
    save({checkins:{...(u.checkins||{}),[today]:nd}})
  }
  const doCheckin=async()=>{
    if(alreadyIn)return
    // include media in done count
    const allDone={...done}
    if(mediaRule)allDone['media_today']=true
    await checkin(today,allDone)
    setOk(true);setTimeout(()=>setOk(false),3000)
  }
  const addH=()=>{
    if(!nh.trim())return
    const daily=[...habits,{id:'d'+Date.now(),text:nh.trim(),category:'custom'}]
    save({tasks:{...u.tasks,daily}})
    setNh('')
  }
  const deleteHabit=id=>{
    save({tasks:{...u.tasks,daily:habits.filter(h=>h.id!==id)}})
  }
  const saveEditHabit=()=>{
    if(!editText.trim())return
    save({tasks:{...u.tasks,daily:habits.map(h=>h.id===editHabit?{...h,text:editText.trim()}:h)}})
    setEditHabit(null)
  }

  const grp={}
  habits.forEach(h=>{const k=h.category||'custom';if(!grp[k])grp[k]=[];grp[k].push(h)})
  if(mediaRule){if(!grp['no media'])grp['no media']=[];grp['no media'].push({id:'nm_today',text:`${mediaRule.emoji} ${mediaRule.rule}`,category:'no media',isMedia:true})}

  return(
    <div style={{padding:'14px'}}>
      <div>
      <div style={{marginBottom:'16px'}}>
        <div style={{fontFamily:'Playfair Display,serif',fontSize:'22px',color:'#1A1220',marginBottom:'2px'}}>{dateStr}</div>
        <div style={{fontSize:'12px',color:'#A898B0'}}>here's what's on your list today</div>
      </div>
      <div style={{background:`linear-gradient(135deg,${l},#F3EEFF)`,borderRadius:'16px',padding:'16px',marginBottom:'18px',display:'flex',alignItems:'center',gap:'14px',border:`0.5px solid ${c}22`}}>
        <svg width="64" height="64" viewBox="0 0 64 64" style={{flexShrink:0}}>
          <circle cx="32" cy="32" r="28" fill="none" stroke={`${c}22`} strokeWidth="5"/>
          <circle cx="32" cy="32" r="28" fill="none" stroke={c} strokeWidth="5" strokeDasharray={`${(doneCount/Math.max(total,1))*175.9} 175.9`} strokeLinecap="round" transform="rotate(-90 32 32)" style={{transition:'stroke-dasharray 0.4s'}}/>
          <text x="32" y="37" textAnchor="middle" fontSize="14" fontWeight="700" fill={c} fontFamily="DM Sans,sans-serif">{doneCount}/{total}</text>
        </svg>
        <div style={{flex:1}}>
          <div style={{fontSize:'15px',fontWeight:'700',color:'#1A1220',marginBottom:'3px'}}>{doneCount===0?"let's get it! 💪":doneCount===total?'all done!! 🎉':'keep going ✨'}</div>
          <div style={{fontSize:'12px',color:'#6B5870',lineHeight:1.5}}>{doneCount===total?'incredible — check in below! 🌸':`${total-doneCount} habit${total-doneCount!==1?'s':''} left`}</div>
          <div style={{marginTop:'8px'}}>
            <div style={{height:'4px',background:`${c}22`,borderRadius:'4px'}}>
              <div style={{height:'100%',width:`${(doneCount/Math.max(total,1))*100}%`,background:c,borderRadius:'4px',transition:'width 0.4s'}}/>
            </div>
          </div>
        </div>
        {!alreadyIn&&doneCount>0&&<button onClick={doCheckin} style={{background:'white',color:c,borderRadius:'11px',padding:'8px 12px',fontSize:'11px',fontWeight:'700',border:`1px solid ${c}44`,cursor:'pointer',flexShrink:0,textAlign:'center'}}>
          <div style={{fontSize:'10px',color:'#A898B0',marginBottom:'2px',fontWeight:'600'}}>check in</div>
          <div style={{fontSize:'18px',lineHeight:1}}>✅</div>
        </button>}
        {alreadyIn&&<div style={{background:'white',borderRadius:'11px',padding:'8px 12px',textAlign:'center',flexShrink:0}}>
          <div style={{fontSize:'10px',color:'#A898B0',marginBottom:'2px',fontWeight:'600'}}>done!</div>
          <div style={{fontSize:'18px',lineHeight:1}}>✅</div>
        </div>}
      </div>
    </div>
      {ok&&<div style={{background:'#EDFBF3',border:'1px solid #A8ECC8',borderRadius:'10px',padding:'9px 13px',marginBottom:'10px',textAlign:'center',fontSize:'13px',color:'#1E6E44',fontWeight:'600'}}>🎉 day {(u.day||2)-1} logged! keep going 🔥</div>}

      {Object.entries(grp).map(([cat,items])=>{
        const cs=CAT_STYLE[cat]||CAT_STYLE.custom
        return(<div key={cat} style={{marginBottom:'10px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px',paddingLeft:'2px'}}>
            <div style={{width:'8px',height:'8px',borderRadius:'50%',background:cs.tx,flexShrink:0}}/>
            <span style={{fontSize:'13px',fontWeight:'700',color:cs.tx,textTransform:'uppercase',letterSpacing:'1.2px'}}>{cat}</span>
            <div style={{flex:1,height:'0.5px',background:cs.br}}/>
            <span style={{fontSize:'11px',color:'#A898B0'}}>{items.filter(h=>done[h.id]).length}/{items.length}</span>
          </div>
          <div style={{background:'white',borderRadius:'13px',border:'1px solid rgba(180,140,165,0.18)',overflow:'hidden'}}>
            {items.map((h,i)=>{
              const isDone=!!done[h.id]
              return(<div key={h.id}>
                {editHabit===h.id?(
                  <div style={{padding:'10px 13px',borderBottom:i<items.length-1?'1px solid rgba(180,140,165,0.12)':'none'}}>
                    <div style={{display:'flex',gap:'7px'}}>
                      <input value={editText} onChange={e=>setEditText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveEditHabit()} autoFocus style={{flex:1,padding:'7px 10px',borderRadius:'8px',border:`1.5px solid ${c}`,fontSize:'13px',outline:'none',fontFamily:'DM Sans,sans-serif'}}/>
                      <button onClick={saveEditHabit} style={{padding:'0 12px',borderRadius:'8px',background:c,color:'white',fontWeight:'700',fontSize:'12px',border:'none',cursor:'pointer'}}>save</button>
                      <button onClick={()=>setEditHabit(null)} style={{color:'#A898B0',fontSize:'12px',background:'none',border:'none',cursor:'pointer'}}>✕</button>
                    </div>
                  </div>
                ):(
                  <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'11px 14px',borderBottom:i<items.length-1?'1px solid rgba(180,140,165,0.12)':'none',background:isDone?cs.bg:'white',transition:'background 0.15s'}}>
                    <div onClick={()=>toggle(h.id)} style={{width:'22px',height:'22px',borderRadius:'50%',flexShrink:0,background:isDone?cs.tx:'white',border:isDone?'none':`2px solid ${cs.br}`,display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.2s',cursor:'pointer'}}>
                      {isDone&&<i className="ti ti-check" style={{fontSize:'12px',color:'white'}}/>}
                    </div>
                    <span onClick={()=>toggle(h.id)} style={{fontSize:'15px',flex:1,color:isDone?'#A898B0':'#1A1220',textDecoration:isDone?'line-through':'none',cursor:'pointer'}}>{h.text}</span>
                    {!h.isMedia&&<div style={{display:'flex',gap:'5px'}}>
                      <button onClick={()=>{setEditHabit(h.id);setEditText(h.text)}} style={{color:'#A898B0',background:'none',border:'none',cursor:'pointer',padding:'2px'}}><i className="ti ti-pencil" style={{fontSize:'13px'}}/></button>
                      <button onClick={()=>deleteHabit(h.id)} style={{color:'#A898B0',background:'none',border:'none',cursor:'pointer',padding:'2px'}}><i className="ti ti-trash" style={{fontSize:'13px'}}/></button>
                    </div>}
                  </div>
                )}
              </div>)
            })}
          </div>
        </div>)
      })}

      <div style={{display:'flex',gap:'7px',marginBottom:'12px'}}>
        <input value={nh} onChange={e=>setNh(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addH()} placeholder="+ add a daily habit..." style={{flex:1,padding:'10px 13px',borderRadius:'12px',border:`1.5px dashed ${c}88`,fontSize:'13px',outline:'none',background:'#FDF8FB',fontFamily:'DM Sans,sans-serif'}}/>
        {nh&&<button onClick={addH} style={{padding:'0 13px',borderRadius:'12px',background:c,color:'white',fontWeight:'700',fontSize:'12px',border:'none',cursor:'pointer'}}>add</button>}
      </div>
      <div style={{background:'linear-gradient(135deg,#F3EEFF,#FDF0F5)',border:'1px solid #CDB8FF',borderRadius:'13px',padding:'12px 14px'}}>
        <div style={{fontSize:'11px',fontWeight:'700',color:'#6B44CC',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'5px'}}>my why</div>
        <div style={{fontSize:'12px',color:'#5A3070',lineHeight:1.6,fontStyle:'italic'}}>"{u.why||'tap goals to write your why'}"</div>
      </div>
    </div>
  )
}

  const [adding,setAdding]=useState(false)
  const [nt,setNt]=useState('')
  const [editGoal,setEditGoal]=useState(null)
  const [editTitle,setEditTitle]=useState('')

      {goals.map((g,i)=>(
        <div key={g.id} style={{background:'white',borderRadius:'13px',border:'1px solid rgba(180,140,165,0.18)',borderLeft:`4px solid ${BCS[i%6]}`,padding:'11px 13px',marginBottom:'8px'}}>
          {editGoal===g.id?(
            <div>
              <input value={editTitle} onChange={e=>setEditTitle(e.target.value)} style={{width:'100%',padding:'7px 10px',borderRadius:'8px',border:`1.5px solid ${c}`,fontSize:'13px',outline:'none',marginBottom:'6px',fontFamily:'DM Sans,sans-serif'}}/>
              <input value={editDesc} onChange={e=>setEditDesc(e.target.value)} placeholder="description (optional)..." style={{width:'100%',padding:'7px 10px',borderRadius:'8px',border:'1.5px solid rgba(180,140,165,0.35)',fontSize:'12px',outline:'none',marginBottom:'8px',fontFamily:'DM Sans,sans-serif'}}/>
              <div style={{display:'flex',gap:'7px'}}>
                <button onClick={saveGoalEdit} style={{background:c,color:'white',borderRadius:'8px',padding:'6px 14px',fontWeight:'700',fontSize:'12px',border:'none',cursor:'pointer'}}>save</button>
                <button onClick={()=>setEditGoal(null)} style={{color:'#A898B0',fontSize:'12px',background:'none',border:'none',cursor:'pointer'}}>cancel</button>
              </div>

          ):(
            <div>

                <div style={{flex:1}}>
                  <div style={{fontSize:'15px',fontWeight:'600',color:'#1A1220'}}>{g.title}</div>
                  {g.desc&&<div style={{fontSize:'11px',color:'#6B5870',marginTop:'2px'}}>{g.desc}</div>}

                  <button onClick={()=>{setEditGoal(g.id);setEditTitle(g.title);setEditDesc(g.desc||'')}} style={{color:'#A898B0',background:'none',border:'none',cursor:'pointer'}}><i className="ti ti-pencil" style={{fontSize:'14px'}}/></button>
                  <button onClick={()=>deleteGoal(g.id)} style={{color:'#A898B0',background:'none',border:'none',cursor:'pointer'}}><i className="ti ti-trash" style={{fontSize:'14px'}}/></button>

            <div style={{display:'flex',gap:'7px'}}>

// ── MEDIA ─────────────────────────────────────────────────────────────
function Media({u,save}){
  const c=u.color||'#B5365F'
  const l=u.color_light||'#FDF0F5'
  const [rules,setRules]=useState(u.media_rules||[])
  const [editing,setEditing]=useState(false)
  const [challengeName,setChallengeName]=useState(u.media_challenge_name||'no-media challenge')
  const [editName,setEditName]=useState(false)
  const [nameDraft,setNameDraft]=useState(challengeName)
  const [addingDay,setAddingDay]=useState(false)
  const [newDay,setNewDay]=useState('')
  const [newRule,setNewRule]=useState('')
  const [newEmoji,setNewEmoji]=useState('📵')
  const todayR=rules.find(r=>r.day===TODAY_DAY)

  const saveRules=()=>{
    save({media_rules:rules,media_challenge_name:challengeName})
    setEditing(false)
  }
  const saveName=()=>{
    setChallengeName(nameDraft)
    save({media_challenge_name:nameDraft})
    setEditName(false)
  }
  const addRule=()=>{
    if(!newDay.trim()||!newRule.trim())return
    setRules(p=>[...p,{day:newDay.trim(),rule:newRule.trim(),emoji:newEmoji}])
    setNewDay('');setNewRule('');setNewEmoji('📵');setAddingDay(false)
  }
  const removeRule=day=>setRules(p=>p.filter(r=>r.day!==day))

  if(rules.length===0&&!editing)return(
    <div style={{padding:'14px'}}>
      <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'24px',color:'#1A1220',marginBottom:'10px'}}>no-media challenge 📵</h2>
      <div style={{background:l,border:`1px solid ${c}44`,borderRadius:'13px',padding:'16px',textAlign:'center',marginBottom:'12px'}}>

        <div style={{fontSize:'11px',color:'#A898B0',marginBottom:'12px'}}>want to add it now?</div>

      </div>
    </div>
  )

  return(
    <div style={{padding:'14px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'3px'}}>
        {editName?(
          <div style={{display:'flex',gap:'7px',flex:1,marginRight:'8px'}}>
            <input value={nameDraft} onChange={e=>setNameDraft(e.target.value)} autoFocus style={{flex:1,padding:'6px 10px',borderRadius:'8px',border:`1.5px solid ${c}`,fontSize:'16px',fontFamily:'Playfair Display,serif',fontWeight:'700',outline:'none'}}/>
            <button onClick={saveName} style={{background:c,color:'white',borderRadius:'8px',padding:'0 12px',fontWeight:'700',fontSize:'12px',border:'none',cursor:'pointer'}}>save</button>

          <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
            <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'21px',color:'#1A1220'}}>{challengeName} 📵</h2>
            <button onClick={()=>{setEditName(true);setNameDraft(challengeName)}} style={{color:'#A898B0',background:'none',border:'none',cursor:'pointer'}}><i className="ti ti-pencil" style={{fontSize:'14px'}}/></button>
          </div>
        )}
        <button onClick={()=>setEditing(!editing)} style={{background:editing?c:l,color:editing?'white':c,border:`1px solid ${c}44`,borderRadius:'10px',padding:'5px 12px',fontSize:'11px',fontWeight:'700',cursor:'pointer'}}>{editing?'done':'edit'}</button>
      </div>
      <p style={{fontSize:'11px',color:'#A898B0',marginBottom:'12px'}}>tap edit to customize your rules anytime</p>

      {todayR&&!editing&&<div style={{background:'linear-gradient(135deg,#F3EEFF,#EEF7FF)',borderRadius:'18px',padding:'20px',marginBottom:'20px',display:'flex',alignItems:'center',gap:'16px',border:'0.5px solid rgba(107,68,204,0.15)'}}>
        <div style={{fontSize:'48px',flexShrink:0,lineHeight:1}}>{todayR.emoji}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:'10px',fontWeight:'700',color:'#6B44CC',textTransform:'uppercase',letterSpacing:'1.2px',marginBottom:'5px'}}>today · {TODAY_DAY}</div>
          <div style={{fontFamily:'Playfair Display,serif',fontSize:'20px',fontWeight:'700',color:'#1A1220',marginBottom:'4px'}}>{todayR.rule}</div>
          <div style={{fontSize:'12px',color:'#6B44CC',lineHeight:1.5}}>your mind is yours today 💜</div>
        </div>
      </div>}

      <div style={{background:'white',borderRadius:'13px',border:'1px solid rgba(180,140,165,0.18)',overflow:'hidden',marginBottom:'12px'}}>
        {rules.map((r,i)=>(
          <div key={r.day+i} style={{display:'flex',alignItems:'center',gap:'9px',padding:'10px 13px',borderBottom:i<rules.length-1?'1px solid rgba(180,140,165,0.12)':'none',background:r.day===TODAY_DAY&&!editing?l:'white'}}>

                <input value={r.day} onChange={e=>setRules(p=>p.map((x,j)=>j===i?{...x,day:e.target.value}:x))} style={{width:'44px',padding:'5px 6px',borderRadius:'7px',border:'1px solid #E0D0D8',fontSize:'11px',outline:'none',fontWeight:'700',fontFamily:'DM Sans,sans-serif'}}/>
                <input value={r.rule} onChange={e=>setRules(p=>p.map((x,j)=>j===i?{...x,rule:e.target.value}:x))} style={{flex:1,padding:'5px 9px',borderRadius:'7px',border:'1px solid #E0D0D8',fontSize:'12px',outline:'none',fontFamily:'DM Sans,sans-serif'}}/>
                <button onClick={()=>removeRule(r.day)} style={{color:'#F4ADCA',background:'none',border:'none',cursor:'pointer'}}><i className="ti ti-trash" style={{fontSize:'15px'}}/></button>
              </>
            ):(

                <div style={{fontSize:'18px',width:'26px',textAlign:'center'}}>{r.emoji}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:'10px',fontWeight:'700',color:r.day===TODAY_DAY?c:'#A898B0',textTransform:'uppercase',letterSpacing:'0.5px'}}>{r.day}{r.day===TODAY_DAY?' · today':''}</div>
                  <div style={{fontSize:'12px',color:'#1A1220',marginTop:'1px'}}>{r.rule}</div>
                </div>
              </>
            )}
          </div>
        ))}
      </div>

      {editing&&(
        <div style={{marginBottom:'12px'}}>

// ── TASKS ─────────────────────────────────────────────────────────────
function Tasks({u,save}){
  const [list,setList]=useState('general')
  const [nt,setNt]=useState('')
  const [urg,setUrg]=useState(false)
  const c=u.color||'#B5365F'
  const l=u.color_light||'#FDF0F5'
  const general=(u.tasks?.general)||[]
  const weekly=(u.tasks?.weekly)||[]
  const daily=(u.tasks?.daily)||[]
  const weekKey=()=>{const d=new Date();const s=new Date(d);s.setDate(d.getDate()-d.getDay());return s.toDateString()}
  const togG=id=>save({tasks:{...u.tasks,general:general.map(t=>t.id===id?{...t,done:!t.done}:t)}})
  const togU=id=>save({tasks:{...u.tasks,general:general.map(t=>t.id===id?{...t,urgent:!t.urgent}:t)}})
  const remG=id=>save({tasks:{...u.tasks,general:general.filter(t=>t.id!==id)}})
  const addT=()=>{
    if(!nt.trim())return
    if(list==='general')save({tasks:{...u.tasks,general:[...general,{id:'g'+Date.now(),text:nt.trim(),urgent:urg,done:false}]}})
    if(list==='weekly')save({tasks:{...u.tasks,weekly:[...weekly,{id:'w'+Date.now(),text:nt.trim(),category:'custom'}]}})
    setNt('');setUrg(false)
  }
  const togW=id=>{const k=weekKey()+'_'+id;save({weekly_done:{...(u.weekly_done||{}),[k]:!(u.weekly_done||{})[k]}})}
  const remW=id=>save({tasks:{...u.tasks,weekly:weekly.filter(t=>t.id!==id)}})
  const urg_i=general.filter(t=>t.urgent&&!t.done)
  const reg_i=general.filter(t=>!t.urgent&&!t.done)
  const don_i=general.filter(t=>t.done)

  return(
    <div style={{padding:'14px'}}>
      <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'22px',color:'#1A1220',marginBottom:'2px'}}>my tasks ✅</h2>
      <p style={{fontSize:'12px',color:'#A898B0',marginBottom:'16px'}}>{new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</p>
      <div style={{display:'flex',gap:'6px',marginBottom:'13px'}}>
        {[['general','to-do'],['weekly','weekly'],['daily','daily']].map(([id,lbl])=>(
          <button key={id} onClick={()=>setList(id)} style={{flex:1,padding:'8px 5px',borderRadius:'11px',fontSize:'11px',fontWeight:'700',border:'1px solid rgba(180,140,165,0.3)',background:list===id?c:'white',color:list===id?'white':'#6B5870',cursor:'pointer',transition:'all 0.15s'}}>{lbl}</button>
        ))}
      </div>

      {list==='general'&&<div>
        {urg_i.length>0&&<div style={{marginBottom:'10px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}}>
            <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'#B5365F',flexShrink:0}}/>
            <span style={{fontSize:'13px',fontWeight:'700',color:'#B5365F',textTransform:'uppercase',letterSpacing:'1.2px'}}>urgent</span>
            <div style={{flex:1,height:'0.5px',background:'rgba(181,54,95,0.2)'}}/>
            <span style={{fontSize:'11px',color:'#A898B0'}}>{urg_i.length} task{urg_i.length!==1?'s':''}</span>
          </div>
          <div style={{background:'white',borderRadius:'12px',border:'1px solid rgba(181,54,95,0.2)',overflow:'hidden'}}>
            {urg_i.map((t,i)=><TRow key={t.id} t={t} onT={()=>togG(t.id)} onU={()=>togU(t.id)} onR={()=>remG(t.id)} last={i===urg_i.length-1} c={c}/>)}
          </div>
        </div>}
        {reg_i.length>0&&<div style={{marginBottom:'10px'}}>
          {urg_i.length>0&&<div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px',marginTop:'6px'}}>
            <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'#A898B0',flexShrink:0}}/>
            <span style={{fontSize:'13px',fontWeight:'700',color:'#A898B0',textTransform:'uppercase',letterSpacing:'1.2px'}}>regular</span>
            <div style={{flex:1,height:'0.5px',background:'rgba(168,152,176,0.2)'}}/>
            <span style={{fontSize:'11px',color:'#A898B0'}}>{reg_i.length} task{reg_i.length!==1?'s':''}</span>
          </div>}
          <div style={{background:'white',borderRadius:'12px',border:'1px solid rgba(180,140,165,0.18)',overflow:'hidden'}}>
            {reg_i.map((t,i)=><TRow key={t.id} t={t} onT={()=>togG(t.id)} onU={()=>togU(t.id)} onR={()=>remG(t.id)} last={i===reg_i.length-1} c={c}/>)}
          </div>
        </div>}
        {don_i.length>0&&<div style={{marginBottom:'10px',opacity:0.65}}>
          <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}}>
            <div style={{width:'8px',height:'8px',borderRadius:'50%',background:'#1E6E44',flexShrink:0}}/>
            <span style={{fontSize:'13px',fontWeight:'700',color:'#1E6E44',textTransform:'uppercase',letterSpacing:'1.2px'}}>done today 🎉</span>
            <div style={{flex:1,height:'0.5px',background:'rgba(30,110,68,0.2)'}}/>
            <span style={{fontSize:'11px',color:'#A898B0'}}>{don_i.length}</span>
          </div>
          <div style={{background:'white',borderRadius:'12px',border:'1px solid rgba(180,140,165,0.18)',overflow:'hidden'}}>
            {don_i.map((t,i)=><TRow key={t.id} t={t} onT={()=>togG(t.id)} onU={()=>{}} onR={()=>remG(t.id)} last={i===don_i.length-1} isDone c={c}/>)}
          </div>
        </div>}
        <div style={{display:'flex',gap:'7px',marginBottom:'8px'}}>
          <input value={nt} onChange={e=>setNt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addT()} placeholder="add a task..." style={{flex:1,padding:'10px 13px',borderRadius:'11px',border:`1.5px dashed ${c}88`,fontSize:'13px',outline:'none',background:l,fontFamily:'DM Sans,sans-serif'}}/>
          <button onClick={()=>setUrg(!urg)} style={{padding:'0 10px',borderRadius:'10px',background:urg?'rgba(181,54,95,0.1)':'transparent',border:`1px solid ${urg?'#B5365F':'rgba(180,140,165,0.3)'}`,color:urg?'#B5365F':'#A898B0',fontSize:'11px',fontWeight:'700',cursor:'pointer'}}>urgent</button>
          {nt&&<button onClick={addT} style={{padding:'0 12px',borderRadius:'10px',background:c,color:'white',fontWeight:'700',fontSize:'12px',border:'none',cursor:'pointer'}}>add</button>}
        </div>
      </div>}

      {list==='weekly'&&<div>
        <div style={{fontSize:'11px',color:'#A898B0',marginBottom:'9px'}}>resets every sunday 🌙</div>
        <div style={{background:'white',borderRadius:'12px',border:'1px solid rgba(180,140,165,0.18)',overflow:'hidden',marginBottom:'10px'}}>
          {weekly.map((t,i)=>{
            const k=weekKey()+'_'+t.id
            const wd=!!(u.weekly_done&&u.weekly_done[k])
            return(<div key={t.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'11px 13px',borderBottom:i<weekly.length-1?'1px solid rgba(180,140,165,0.12)':'none',background:wd?'#EDFBF3':'white'}}>
              <div onClick={()=>togW(t.id)} style={{width:'20px',height:'20px',borderRadius:'5px',background:wd?'#1E6E44':'white',border:wd?'none':'2px solid #A8ECC8',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all 0.2s',cursor:'pointer'}}>
                {wd&&<i className="ti ti-check" style={{fontSize:'11px',color:'white'}}/>}
              </div>
              <span onClick={()=>togW(t.id)} style={{fontSize:'13px',color:wd?'#A898B0':'#1A1220',textDecoration:wd?'line-through':'none',flex:1,cursor:'pointer'}}>{t.text}</span>
              <button onClick={()=>remW(t.id)} style={{color:'#A898B0',background:'none',border:'none',cursor:'pointer'}}><i className="ti ti-trash" style={{fontSize:'14px'}}/></button>
            </div>)
          })}
        </div>
        <div style={{display:'flex',gap:'7px'}}>
          <input value={nt} onChange={e=>setNt(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addT()} placeholder="add weekly task..." style={{flex:1,padding:'10px 13px',borderRadius:'11px',border:'1.5px dashed #A8ECC8',fontSize:'13px',outline:'none',background:'#EDFBF3',fontFamily:'DM Sans,sans-serif'}}/>
          {nt&&<button onClick={addT} style={{padding:'0 12px',borderRadius:'10px',background:'#1E6E44',color:'white',fontWeight:'700',fontSize:'12px',border:'none',cursor:'pointer'}}>add</button>}
        </div>
      </div>}

      {list==='daily'&&<div>
        <div style={{background:l,border:`1px solid ${c}44`,borderRadius:'12px',padding:'11px 13px',marginBottom:'10px'}}>
          <div style={{fontSize:'11px',fontWeight:'700',color:c,marginBottom:'3px'}}>💡 daily habits live on the today tab</div>
          <div style={{fontSize:'11px',color:'#A898B0'}}>they auto-reset each midnight. tap ✏️ on any habit to edit it.</div>
        </div>
        <div style={{background:'white',borderRadius:'12px',border:'1px solid rgba(180,140,165,0.18)',overflow:'hidden'}}>
          {daily.map((t,i)=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'11px 13px',borderBottom:i<daily.length-1?'1px solid rgba(180,140,165,0.12)':'none'}}>
              <div style={{width:'7px',height:'7px',borderRadius:'50%',background:c,flexShrink:0}}/>
              <span style={{fontSize:'13px',color:'#1A1220',flex:1}}>{t.text}</span>
              <span style={{fontSize:'10px',color:c,fontWeight:'600',background:l,padding:'2px 7px',borderRadius:'10px'}}>{t.category}</span>
            </div>
          ))}
        </div>
      </div>}
    </div>
  )
}

function TRow({t,onT,onU,onR,last,isDone,c='#B5365F'}){
  const [open,setOpen]=useState(false)
  return(<div style={{borderBottom:last?'none':'1px solid rgba(180,140,165,0.12)'}}>
    <div style={{display:'flex',alignItems:'center',gap:'10px',padding:'11px 13px'}}>
      <div onClick={onT} style={{width:'20px',height:'20px',borderRadius:'50%',flexShrink:0,cursor:'pointer',background:isDone?'#1E6E44':t.urgent?'rgba(181,54,95,0.1)':'white',border:isDone?'none':t.urgent?'2px solid #B5365F':'2px solid rgba(180,140,165,0.35)',display:'flex',alignItems:'center',justifyContent:'center',transition:'all 0.2s'}}>
        {isDone&&<i className="ti ti-check" style={{fontSize:'11px',color:'white'}}/>}
        {t.urgent&&!isDone&&<span style={{width:'5px',height:'5px',borderRadius:'50%',background:'#B5365F',display:'block'}}/>}
      </div>
      <span style={{flex:1,fontSize:'15px',color:isDone?'#A898B0':'#1A1220',textDecoration:isDone?'line-through':'none'}}>{t.text}</span>
      {t.urgent&&!isDone&&<span style={{fontSize:'9px',fontWeight:'800',padding:'2px 6px',borderRadius:'10px',background:'rgba(181,54,95,0.1)',color:'#B5365F',border:'1px solid rgba(181,54,95,0.2)'}}>URGENT</span>}
      <button onClick={()=>setOpen(!open)} style={{color:'#A898B0',background:'none',border:'none',cursor:'pointer'}}><i className="ti ti-dots" style={{fontSize:'15px'}}/></button>
    </div>
    {open&&<div style={{display:'flex',gap:'5px',padding:'0 13px 9px',flexWrap:'wrap'}}>
      {!isDone&&<button onClick={()=>{onU();setOpen(false)}} style={{fontSize:'10px',fontWeight:'700',padding:'3px 9px',borderRadius:'20px',background:'rgba(181,54,95,0.08)',color:'#B5365F',border:'1px solid rgba(181,54,95,0.2)',cursor:'pointer'}}>{t.urgent?'remove urgent':'🔴 mark urgent'}</button>}
      <button onClick={()=>{onR();setOpen(false)}} style={{fontSize:'10px',fontWeight:'700',padding:'3px 9px',borderRadius:'20px',background:'#FDF0F5',color:'#B5365F',border:'1px solid #F4ADCA',cursor:'pointer'}}>remove</button>
      <button onClick={()=>setOpen(false)} style={{fontSize:'10px',color:'#A898B0',background:'none',border:'none',cursor:'pointer'}}>cancel</button>
    </div>}
  </div>)
}

// ── SQUAD ─────────────────────────────────────────────────────────────
function Squad({u,me,groups,mkGroup,joinGroup,deleteGroup,heart,affirm,postFeed,refreshGroups}){
  const [view,setView]=useState('feed')
  const [gn,setGn]=useState('')
  const [jc,setJc]=useState('')
  const [msg,setMsg]=useState('')
  const [win,setWin]=useState('')
  const [sharing,setSharing]=useState(false)
  const [affFor,setAffFor]=useState(null)
  const [loading,setLoading]=useState(false)
  const [commenting,setCommenting]=useState(null)
  const [commentText,setCommentText]=useState('')
  const [refreshing,setRefreshing]=useState(false)
  const [activeGroup,setActiveGroup]=useState(0)
  const c=u.color||'#B5365F'
  const l=u.color_light||'#FDF0F5'
  const ag=groups[activeGroup>=groups.length?0:activeGroup]||groups[0]

  useEffect(()=>{
    if(refreshGroups)refreshGroups()
    // Auto-refresh every 30 seconds while on squad tab
    const interval=setInterval(()=>{if(refreshGroups)refreshGroups()},30000)
    return ()=>clearInterval(interval)
  },[])

  const doRefresh=async()=>{
    setRefreshing(true)
    if(refreshGroups)await refreshGroups()
    setRefreshing(false)
  }

  const submitComment=async(postId)=>{
    if(!commentText.trim()||!ag)return
    await affirm(ag.code,postId,commentText.trim())
    setCommentText('')
    setCommenting(null)
  }
  const ago=ts=>{const m=Math.floor((Date.now()-ts)/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}
  const doCreate=async()=>{if(!gn.trim())return;setLoading(true);const code=await mkGroup(gn.trim());setMsg(`created! share code: ${code} 🎉`);setGn('');setView('feed');setLoading(false)}
  const doJoin=async()=>{
    setLoading(true)
    const ok=await joinGroup(jc.trim().toUpperCase())
    if(ok){
      await doRefresh()
      const joined=groups.find(g=>g.code===jc.trim().toUpperCase())
      setMsg(`you joined ${joined?.name||'the group'}! 🎉 welcome to the squad 🌸`)
      setJc('')
      setView('feed')
      // Switch to the newly joined group
      const newIdx=groups.findIndex(g=>g.code===jc.trim().toUpperCase())
      if(newIdx>=0)setActiveGroup(newIdx)
    }else{
      setMsg('code not found — double check it!')
    }
    setLoading(false)
  }
  const doWin=async()=>{if(!win.trim()||!ag)return;await postFeed(ag.code,'win',{text:win.trim()});setWin('');setSharing(false)}

  if(groups.length===0)return(
    <div style={{padding:'14px'}}>
      <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'24px',color:'#1A1220',marginBottom:'3px'}}>squad 👯‍♀️</h2>
      <p style={{fontSize:'11px',color:'#A898B0',marginBottom:'13px'}}>create a group or join one</p>
      <div style={{background:l,border:`1px solid ${c}44`,borderRadius:'14px',padding:'20px',textAlign:'center',marginBottom:'11px'}}>
        <div style={{fontSize:'36px',marginBottom:'7px'}}>🌸</div>
        <div style={{fontSize:'14px',fontWeight:'700',color:c,marginBottom:'3px'}}>no group yet</div>
        <div style={{fontSize:'11px',color:'#6B5870'}}>create one for you and kiara, or join with a code</div>
      </div>
      <button onClick={()=>setView(view==='create'?'feed':'create')} style={{width:'100%',padding:'12px',borderRadius:'12px',background:c,color:'#fff',fontSize:'14px',fontWeight:'900',border:'none',cursor:'pointer',marginBottom:'8px'}}>create a group ✨</button>
      <button onClick={()=>setView(view==='join'?'feed':'join')} style={{width:'100%',padding:'12px',borderRadius:'12px',border:'1.5px solid #A8D8FF',color:'#1870BB',fontSize:'14px',fontWeight:'900',background:'#EEF7FF',cursor:'pointer',marginBottom:'12px'}}>join with a code 🔗</button>

        </div>

        <Input value={jc} onChange={v=>setJc(v.toUpperCase())} onEnter={doJoin} placeholder="ABC12" style={{fontSize:'18px',letterSpacing:'4px',textAlign:'center',fontWeight:'700',marginBottom:'10px'}}/>

            </button>

        </div>
      </div>}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'11px'}}>

// ── FAV ROW (swipe to delete) ─────────────────────────────────────────
function FavRow({meal,isLast,onRecipe,onDelete,c}){
  const swipeState=useState(0)
  const swipeX=swipeState[0], setSwipeX=swipeState[1]
  const startState=useState(null)
  const startX=startState[0], setStartX=startState[1]
  const delState=useState(false)
  const showDelete=delState[0], setShowDelete=delState[1]
  const threshold=60

  const onTouchStart=e=>{setStartX(e.touches[0].clientX)}
  const onTouchMove=e=>{
    if(startX===null)return
    const dx=e.touches[0].clientX-startX
    if(dx<0)setSwipeX(Math.max(dx,-threshold))
  }
  const onTouchEnd=()=>{
    if(swipeX<-threshold/2){setShowDelete(true);setSwipeX(-threshold)}
    else{setSwipeX(0);setShowDelete(false)}
    setStartX(null)
  }

  return(
    <div style={{position:'relative',overflow:'hidden',borderBottom:isLast?'none':'1px solid rgba(180,140,165,0.1)'}}>
      {showDelete&&<div style={{position:'absolute',right:0,top:0,bottom:0,width:`${threshold}px`,background:'#FF4444',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}} onClick={()=>{setShowDelete(false);setSwipeX(0);onDelete()}}>
        <i className="ti ti-trash" style={{fontSize:'18px',color:'white'}}/>
      </div>}
      <div onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:'8px',padding:'10px 0',transform:`translateX(${swipeX}px)`,transition:startX?'none':'transform 0.2s',background:'white'}}>
        <span style={{fontSize:'16px',flexShrink:0,color:'#B5365F'}}>♥</span>
        <span style={{fontSize:'13px',color:'#1A1220',flex:1,lineHeight:1.4}}>{meal}</span>
        <button onClick={onRecipe} style={{background:'#FDF0F5',color:c,border:`1px solid ${c}44`,borderRadius:'7px',padding:'4px 9px',fontSize:'10px',fontWeight:'700',cursor:'pointer',flexShrink:0}}>recipe</button>
      </div>
    </div>
  )
}

function Nourish({u,me,save}){
  const c=u.color||'#B5365F'
  const l=u.color_light||'#FDF0F5'

  const [loading,setLoading]=useState(false)
  const [setupStep,setSetupStep]=useState(1)

  // Preferences state
  const [dietary,setDietary]=useState(()=>u.nourish_prefs?.dietary||[])
  const [allergies,setAllergies]=useState(()=>u.nourish_prefs?.allergies||'')
  const [goals2,setGoals2]=useState(()=>u.nourish_prefs?.goal?Array.isArray(u.nourish_prefs.goal)?u.nourish_prefs.goal:[u.nourish_prefs.goal]:[])
  const [cuisines,setCuisines]=useState(()=>u.nourish_prefs?.cuisines||[])
  const [customDietary,setCustomDietary]=useState('')

  // prefs initialized from useState lazy init above

  // Meal plan state
  const mealPlan=u.meal_plan||null
  const grocery=u.grocery_list||[]
  const [editGrocery,setEditGrocery]=useState(false)
  const [newItem,setNewItem]=useState('')
  const [newSection,setNewSection]=useState('produce')

  // Progress state
  const progress=u.progress_log||[]
  const [showAddProgress,setShowAddProgress]=useState(false)
  const [progressNote,setProgressNote]=useState('')
  const [progressWeight,setProgressWeight]=useState('')
  const [progressUnit,setProgressUnit]=useState(u.weight_unit||'lbs')
  const startWeight=u.start_weight||null

  const DIETARY_OPTS=['vegetarian','vegan','gluten-free','dairy-free','keto','paleo','halal','kosher','low-carb','high-protein']
  const CUISINE_OPTS=['american','mediterranean','asian','mexican','italian','indian','middle eastern','soul food','caribbean']
  const GOAL_OPTS=['lose weight','build muscle','eat healthier','more energy','better digestion','balanced nutrition','meal prep master']
  const GROCERY_SECTIONS=['produce','protein','dairy & eggs','grains & bread','pantry','snacks','beverages','other']
  const DAYS=['monday','tuesday','wednesday','thursday','friday','saturday','sunday']
  const [recipe,setRecipe]=useState(null)
  const favorites=u.favorite_meals||[]

  const toggleFavorite=async(mealText)=>{
    const isFav=favorites.includes(mealText)
    const updated=isFav?favorites.filter(m=>m!==mealText):[...favorites,mealText]
    await save({favorite_meals:updated})
  }
  const [pendingRecipe,setPendingRecipe]=useState(null)
  const [servings,setServings]=useState(2)

  const swapMeal=async(day,mealType)=>{
    setLoading(true)
    try{
      const resp=await fetch('/api/mealplan',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          type:'swap',
          day,
          meal:mealType,
          current:mealPlan?.[day]?.[mealType]||'',
          prefs:u.nourish_prefs||{},
          goals:u.goals?.map(g=>g.title).join(', ')||''
        })
      })
      const data=await resp.json()
      if(!resp.ok)throw new Error(data.error||'failed')
      const updatedPlan={...mealPlan,[day]:{...mealPlan[day],[mealType]:data.meal}}
      await save({meal_plan:updatedPlan})
    }catch(e){
      alert('Could not swap meal. Try again!')
    }
    setLoading(false)
  }

  const getRecipe=async(mealName,servingCount)=>{
    const count=servingCount||servings
    setRecipe({loading:true,name:mealName})
    try{
      const resp=await fetch('/api/mealplan',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({type:'recipe',meal:mealName,servings:count,prefs:u.nourish_prefs||{},goals:''})
      })
      const data=await resp.json()
      if(!resp.ok)throw new Error(data.error||'failed')
      setRecipe({...data,mealName,servings:count})
    }catch(e){
      setRecipe(null)
      setPendingRecipe(null)
      alert('Could not load recipe. Try again!')
    }
  }

  const savePrefs=async()=>{
    const updatedPrefs={dietary,allergies,goal:goals2,cuisines}
    await save({nourish_prefs:updatedPrefs,nourish_setup:true})
    return updatedPrefs
  }

  const generateMealPlan=async()=>{
    setLoading(true)
    try{
      const resp=await fetch('/api/mealplan',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({prefs:u.nourish_prefs||{},goals:u.goals?.map(g=>g.title).join(', ')||'',nutritionGoals:(u.nourish_prefs?.goal?Array.isArray(u.nourish_prefs.goal)?u.nourish_prefs.goal.join(', '):u.nourish_prefs.goal:'')})
      })
      const parsed=await resp.json()
      if(!resp.ok)throw new Error(parsed.error||'generation failed')
      
      // Convert grocery to list format with checked state
      const groceryList=[]
      Object.entries(parsed.grocery||{}).forEach(([section,items])=>{
        items.forEach(item=>groceryList.push({id:Date.now()+Math.random(),text:item,section,checked:false}))
      })
      
      await save({meal_plan:{...parsed.days,generated:new Date().toLocaleDateString()},grocery_list:groceryList})
      setView('plan')

      console.error(e)
      alert('Something went wrong generating your meal plan. Try again!')
    }
    setLoading(false)

  const toggleGrocery=async(id)=>{
    const updated=(u.grocery_list||[]).map(i=>i.id===id?{...i,checked:!i.checked}:i)
    await save({grocery_list:updated})
  }

  const addGroceryItem=async()=>{
    if(!newItem.trim())return
    const updated=[...(u.grocery_list||[]),{id:Date.now(),text:newItem.trim(),section:newSection,checked:false}]
    await save({grocery_list:updated})

  }

  const removeGroceryItem=async(id)=>{
    await save({grocery_list:(u.grocery_list||[]).filter(i=>i.id!==id)})
  }

  const addProgress=async()=>{
    const entry={id:Date.now(),date:new Date().toLocaleDateString(),weight:progressWeight?parseFloat(progressWeight):null,unit:progressUnit,note:progressNote,day:u.day||1}

    const updates={progress_log:updated,weight_unit:progressUnit}
    if(!u.start_weight&&progressWeight)updates.start_weight=parseFloat(progressWeight)
    await save(updates)
    setProgressWeight('');setProgressNote('');setShowAddProgress(false)
  }

  // SERVINGS PICKER - shows before generating recipe
  if(pendingRecipe&&!recipe)return(
    <div style={{padding:'14px'}}>
      <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'20px'}}>
        <button onClick={()=>setPendingRecipe(null)} style={{color:c,background:'none',border:'none',cursor:'pointer',fontSize:'20px'}}>←</button>
        <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'22px',color:'#1A1220'}}>get the recipe 👩‍🍳</h2>
      </div>

      <div style={{background:l,border:`1px solid ${c}44`,borderRadius:'14px',padding:'14px 16px',marginBottom:'20px'}}>
        <div style={{fontSize:'11px',fontWeight:'700',color:c,textTransform:'uppercase',letterSpacing:'1px',marginBottom:'4px'}}>meal</div>
        <div style={{fontSize:'15px',color:'#1A1220',lineHeight:1.4}}>{pendingRecipe}</div>
      </div>

      <div style={{background:'white',borderRadius:'14px',border:'1px solid rgba(180,140,165,0.2)',padding:'20px',marginBottom:'24px',textAlign:'center'}}>
        <div style={{fontSize:'13px',fontWeight:'700',color:'#1A1220',marginBottom:'16px'}}>how many people are you cooking for?</div>

            <div style={{fontSize:'48px',fontWeight:'900',color:c,lineHeight:1}}>{servings}</div>

        </div>
        <div style={{display:'flex',gap:'8px',justifyContent:'center',marginTop:'16px',flexWrap:'wrap'}}>

            <button key={n} onClick={()=>setServings(n)} style={{padding:'6px 14px',borderRadius:'20px',fontSize:'13px',fontWeight:'700',border:`2px solid ${servings===n?c:'#E0D0D8'}`,background:servings===n?l:'white',color:servings===n?c:'#6B5870',cursor:'pointer',transition:'all 0.15s'}}>{n}</button>

            <div style={{fontSize:'11px',fontWeight:'700',color:'#1E6E44',textTransform:'uppercase',letterSpacing:'1px',marginBottom:'6px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span>{section}</span>
              <span style={{color:'#A898B0',fontWeight:'400'}}>{doneCount}/{items.length}</span>
            </div>
            <div style={{background:'white',borderRadius:'13px',border:'1px solid rgba(180,140,165,0.2)',overflow:'hidden'}}>
              {items.map((item,i)=>(
                <div key={item.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'11px 13px',borderBottom:i<items.length-1?'1px solid rgba(180,140,165,0.12)':'none',background:item.checked?'#EDFBF3':'white',transition:'background 0.15s'}}>
                  <div onClick={()=>toggleGrocery(item.id)} style={{width:'22px',height:'22px',borderRadius:'6px',flexShrink:0,background:item.checked?'#1E6E44':'white',border:item.checked?'none':'2px solid #A8ECC8',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all 0.2s'}}>
                    {item.checked&&<i className="ti ti-check" style={{fontSize:'12px',color:'white'}}/>}
                  </div>
                  <span style={{flex:1,fontSize:'14px',color:item.checked?'#A898B0':'#1A1220',textDecoration:item.checked?'line-through':'none'}}>{item.text}</span>
                  <button onClick={()=>removeGroceryItem(item.id)} style={{color:'#F4ADCA',background:'none',border:'none',cursor:'pointer'}}><i className="ti ti-x" style={{fontSize:'14px'}}/></button>
                </div>
              ))}
            </div>
          </div>
        )
      })}

      {grocery.length===0&&<div style={{textAlign:'center',padding:'40px 20px',color:'#A898B0'}}>
        <div style={{fontSize:'32px',marginBottom:'8px'}}>🛒</div>
        <div style={{fontSize:'14px'}}>no items yet — generate a meal plan or add items above!</div>
      </div>}

      {grocery.filter(i=>i.checked).length>0&&<button onClick={()=>save({grocery_list:grocery.filter(i=>!i.checked)})} style={{width:'100%',padding:'11px',borderRadius:'12px',border:'1.5px solid #A8ECC8',color:'#1E6E44',fontSize:'13px',fontWeight:'700',background:'#EDFBF3',cursor:'pointer',marginTop:'4px'}}>clear checked items ✓</button>}
    </div>
  )

  // PROGRESS VIEW
  if(view==='progress')return(
    <div style={{padding:'14px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
          <button onClick={()=>setView('home')} style={{color:c,background:'none',border:'none',cursor:'pointer',fontSize:'20px'}}>←</button>
          <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'22px',color:'#1A1220'}}>my progress 📈</h2>
        </div>
        <button onClick={()=>setShowAddProgress(true)} style={{background:c,color:'white',borderRadius:'10px',padding:'6px 12px',fontSize:'11px',fontWeight:'700',border:'none',cursor:'pointer'}}>+ log</button>
      </div>

      {/* Stats */}
      {progress.length>0&&(()=>{
        const latest=progress[progress.length-1]
        const weights=progress.filter(p=>p.weight)
        const firstW=weights[0]?.weight
        const lastW=weights[weights.length-1]?.weight
        const diff=firstW&&lastW?Math.abs(lastW-firstW).toFixed(1):null
        const lost=firstW&&lastW&&lastW<firstW
        return(
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'14px'}}>
            <div style={{background:l,border:`1px solid ${c}44`,borderRadius:'12px',padding:'12px',textAlign:'center'}}>
              <div style={{fontSize:'20px',fontWeight:'900',color:c}}>{progress.length}</div>
              <div style={{fontSize:'10px',color:'#A898B0',marginTop:'2px'}}>check-ins</div>
            </div>
            {lastW&&<div style={{background:'#EDFBF3',border:'1px solid #A8ECC8',borderRadius:'12px',padding:'12px',textAlign:'center'}}>
              <div style={{fontSize:'20px',fontWeight:'900',color:'#1E6E44'}}>{lastW}</div>
              <div style={{fontSize:'10px',color:'#A898B0',marginTop:'2px'}}>current {latest.unit}</div>
            </div>}
            {diff&&<div style={{background:'#F3EEFF',border:'1px solid #CDB8FF',borderRadius:'12px',padding:'12px',textAlign:'center'}}>
              <div style={{fontSize:'20px',fontWeight:'900',color:'#6B44CC'}}>{lost?'-':'+' }{diff}</div>
              <div style={{fontSize:'10px',color:'#A898B0',marginTop:'2px'}}>{latest.unit} {lost?'lost':'gained'}</div>
            </div>}
          </div>
        )
      })()}

      {/* Add progress form */}
      {showAddProgress&&<div style={{background:'white',borderRadius:'14px',border:`1.5px solid ${c}`,padding:'14px',marginBottom:'14px'}}>
        <div style={{fontSize:'13px',fontWeight:'700',color:'#1A1220',marginBottom:'10px'}}>log today's check-in</div>
        <div style={{display:'flex',gap:'7px',marginBottom:'8px',alignItems:'center'}}>
          <input value={progressWeight} onChange={e=>setProgressWeight(e.target.value)} placeholder="weight (optional)" type="number" step="0.1" style={{flex:1,padding:'9px 12px',borderRadius:'9px',border:'1.5px solid rgba(180,140,165,0.35)',fontSize:'14px',outline:'none',fontFamily:'DM Sans,sans-serif'}}/>
          <select value={progressUnit} onChange={e=>setProgressUnit(e.target.value)} style={{padding:'9px 10px',borderRadius:'9px',border:'1px solid rgba(180,140,165,0.35)',fontSize:'13px',outline:'none',color:'#6B5870',fontFamily:'DM Sans,sans-serif'}}>
            <option>lbs</option><option>kg</option>
          </select>
        </div>
        <textarea value={progressNote} onChange={e=>setProgressNote(e.target.value)} placeholder="how are you feeling? any wins to note? 🌸" rows={2} style={{width:'100%',padding:'9px 12px',borderRadius:'9px',border:'1.5px solid rgba(180,140,165,0.35)',fontSize:'13px',resize:'none',outline:'none',fontFamily:'DM Sans,sans-serif',marginBottom:'10px'}}/>
        <div style={{display:'flex',gap:'7px'}}>
          <button onClick={addProgress} style={{background:c,color:'white',borderRadius:'9px',padding:'8px 18px',fontWeight:'700',fontSize:'13px',border:'none',cursor:'pointer'}}>save</button>
          <button onClick={()=>setShowAddProgress(false)} style={{color:'#A898B0',fontSize:'13px',background:'none',border:'none',cursor:'pointer'}}>cancel</button>
        </div>
      </div>}

      {/* Progress log */}
      {progress.length===0&&!showAddProgress&&<div style={{textAlign:'center',padding:'40px 20px',color:'#A898B0'}}>
        <div style={{fontSize:'32px',marginBottom:'8px'}}>📈</div>
        <div style={{fontSize:'14px',marginBottom:'12px'}}>no check-ins yet — tap + log to start tracking!</div>
        <div style={{fontSize:'12px',lineHeight:1.6}}>weight is totally optional — you can just log how you're feeling 🌸</div>
      </div>}

      {[...progress].reverse().map((entry,i)=>(
        <div key={entry.id} style={{background:'white',borderRadius:'13px',border:'1px solid rgba(180,140,165,0.2)',padding:'13px 14px',marginBottom:'8px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'4px'}}>
            <div style={{fontSize:'12px',fontWeight:'700',color:c}}>day {entry.day} · {entry.date}</div>
            {entry.weight&&<div style={{fontSize:'13px',fontWeight:'700',color:'#1E6E44'}}>{entry.weight} {entry.unit}</div>}
          </div>
          {entry.note&&<div style={{fontSize:'13px',color:'#6B5870',lineHeight:1.5}}>{entry.note}</div>}
        </div>
      ))}
    </div>
  )

  return null
}

// ── PROFILE MODAL ────────────────────────────────────────────────────
function ProfileModal({u,me,save,onClose}){
  const [editField,setEditField]=useState(null)
  const [startDate,setStartDate]=useState(()=>{
    if(u.start_date){
      try{
        const d=new Date(u.start_date)
        if(!isNaN(d)){return d.toISOString().split('T')[0]}
      }catch{}
    }
    return new Date().toISOString().split('T')[0]
  })
  const [pin,setPin]=useState('')
  const [pin2,setPin2]=useState('')
  const [pinMsg,setPinMsg]=useState('')
  const [color,setColor]=useState(COLORS.find(x=>x.c===u.color)||COLORS[0])
  const c=u.color||'#B5365F'
  const l=u.color_light||'#FDF0F5'

  const saveStartDate=async()=>{
    const start=new Date(startDate+'T00:00:00')
    const today=new Date()
    today.setHours(0,0,0,0)
    const diff=Math.floor((today-start)/(1000*60*60*24))
    const day=Math.max(1,diff+1)
    await save({start_date:startDate,day:day})
    setEditField(null)
    onClose()
  }

  const saveColor=async()=>{
    await save({color:color.c,color_light:color.l})
    setEditField(null)
    onClose()
  }

  const savePin=async()=>{
    if(pin.length<4){setPinMsg('PIN needs 4 digits');return}
    if(pin!==pin2){setPinMsg("PINs don't match");return}
    await save({pin})
    setPinMsg('PIN updated! ✓')
    setPin('');setPin2('')
    setTimeout(()=>setPinMsg(''),2000)
  }

  const totalDays=u.total_days||75
  const day=u.day||1
  const pct=Math.min(100,Math.round((day/totalDays)*100))
  const startDisplay=u.start_date?new Date(u.start_date).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'not set'

  return(
    <div style={{position:'fixed',inset:0,zIndex:300,background:'rgba(20,10,30,0.5)',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'0'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:'white',borderRadius:'0 0 24px 24px',padding:'20px',width:'100%',maxWidth:'480px',boxShadow:'0 8px 40px rgba(0,0,0,0.2)',maxHeight:'90vh',overflowY:'auto'}}>

        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
          <h2 style={{fontFamily:'Playfair Display,serif',fontSize:'20px',color:'#1A1220'}}>my profile ✨</h2>
          <button onClick={onClose} style={{color:'#A898B0',fontSize:'20px',background:'none',border:'none',cursor:'pointer'}}>×</button>
        </div>

        {/* Stats bar */}
        <div style={{background:l,border:`1px solid ${c}44`,borderRadius:'13px',padding:'12px 14px',marginBottom:'16px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
            <div style={{fontSize:'13px',fontWeight:'700',color:c}}>day {day} of {totalDays}</div>
            <div style={{fontSize:'12px',color:'#A898B0'}}>{pct}% complete</div>
          </div>
          <div style={{height:'6px',background:'white',borderRadius:'10px',overflow:'hidden'}}>
            <div style={{height:'100%',width:`${pct}%`,background:`linear-gradient(90deg,${c},#FF6B4A)`,borderRadius:'10px',transition:'width 0.5s'}}/>
          </div>
          <div style={{fontSize:'11px',color:'#A898B0',marginTop:'6px'}}>started {startDisplay}</div>
        </div>

        {/* Start date */}
        <div style={{background:'white',borderRadius:'13px',border:'1px solid rgba(180,140,165,0.2)',padding:'13px 14px',marginBottom:'10px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:editField==='date'?'10px':'0'}}>
            <div>
              <div style={{fontSize:'12px',fontWeight:'700',color:'#1A1220'}}>challenge start date</div>
              <div style={{fontSize:'11px',color:'#A898B0',marginTop:'2px'}}>{startDisplay}</div>
            </div>
            <button onClick={()=>setEditField(editField==='date'?null:'date')} style={{background:l,color:c,border:`1px solid ${c}44`,borderRadius:'8px',padding:'5px 11px',fontSize:'11px',fontWeight:'700',cursor:'pointer'}}>edit</button>
          </div>
          {editField==='date'&&<div>
            <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={{width:'100%',padding:'10px 13px',borderRadius:'10px',border:`1.5px solid ${c}`,fontSize:'14px',outline:'none',marginBottom:'8px',fontFamily:'DM Sans,sans-serif'}}/>
            <div style={{fontSize:'11px',color:'#A898B0',marginBottom:'8px'}}>this will recalculate your current day automatically</div>
            <div style={{display:'flex',gap:'7px'}}>

                  <div style={{width:'16px',height:'16px',borderRadius:'50%',background:color.id===x.id?x.c:'white',border:`2px solid ${color.id===x.id?x.c:'#ddd'}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'9px',color:'white',fontWeight:'900'}}>{color.id===x.id&&'✓'}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:'7px'}}>
              <button onClick={saveColor} style={{background:color.c,color:'white',borderRadius:'9px',padding:'7px 16px',fontWeight:'700',fontSize:'12px',border:'none',cursor:'pointer'}}>save color</button>
              <button onClick={()=>setEditField(null)} style={{color:'#A898B0',fontSize:'12px',background:'none',border:'none',cursor:'pointer'}}>cancel</button>

            <input type="password" inputMode="numeric" value={pin2} onChange={e=>setPin2(e.target.value.replace(/\D/g,'').slice(0,4))} placeholder="confirm PIN" style={{width:'100%',padding:'9px 12px',borderRadius:'9px',border:'1.5px solid rgba(180,140,165,0.35)',fontSize:'16px',letterSpacing:'6px',textAlign:'center',outline:'none',marginBottom:'7px',fontFamily:'DM Sans,sans-serif'}}/>
