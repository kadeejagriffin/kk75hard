        <div style={{background:'white',borderRadius:'13px',border:'1px solid rgba(180,140,165,0.2)',padding:'13px 14px',marginBottom:'10px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:editField==='length'?'10px':'0'}}>
            <div>

            <button onClick={()=>setEditField(editField==='length'?null:'length')} style={{background:l,color:c,border:`1px solid ${c}44`,borderRadius:'8px',padding:'5px 11px',fontSize:'11px',fontWeight:'700',cursor:'pointer'}}>edit</button>

      </div>
    </div>
  )
}

// ── APP ROOT ──────────────────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState('auth')
  const [me,setMe]=useState(null)
  const [u,setU]=useState(null)
  const [loading,setLoading]=useState(false)

  const login=async(name,pin,skipPin=false)=>{
    setLoading(true)
    try{
      const user=await api.getUser(name)
      if(user){
        if(!skipPin&&user.pin!==pin){setLoading(false);return false}
        setMe(name);setU(user)
        localStorage.setItem('ms_session',JSON.stringify({name,pin:user.pin,user}))
        setScreen(user.onboarded?'home':'onboarding')
      }else{
        const newUser={name,pin,onboarded:false,day:1,total_days:75,color:'#B5365F',color_light:'#FDF0F5',tasks:{daily:[],weekly:[],general:[]},goals:[],media_rules:[],why:'',groups:[],checkins:{},weekly_done:{}}
        await api.createUser(newUser)
        setMe(name);setU(newUser)
        localStorage.setItem('ms_session',JSON.stringify({name,pin,user:newUser}))
        setScreen('onboarding')
      }
    }catch(e){
      console.error(e)
      setLoading(false)
      return false
    }
    setLoading(false)
    return true
  }

  // Auto-login: restore immediately from cache, then refresh from Supabase in background
  useEffect(()=>{
    const session=localStorage.getItem('ms_session')
    if(!session)return
    try{
      const {name,pin,user:cachedUser,tab,lastDay}=JSON.parse(session)
      if(!name||!pin)return
      const todayStr=new Date().toDateString()
      const isNewDay=lastDay&&lastDay!==todayStr
      if(cachedUser){
        setMe(name)
        setU(cachedUser)
        setScreen(cachedUser.onboarded?'home':'onboarding')
        // On new day: reset to today tab and clear quote so it shows again
        if(isNewDay){
          localStorage.setItem('ms_session',JSON.stringify({name,pin,user:cachedUser,tab:'today',lastDay:todayStr}))
          localStorage.removeItem('quote_date_'+name)
        }
      }
      api.getUser(name).then(freshUser=>{
        if(freshUser&&freshUser.pin===pin){
          setU(freshUser)
          const currentSession=JSON.parse(localStorage.getItem('ms_session')||'{}')
          localStorage.setItem('ms_session',JSON.stringify({...currentSession,user:freshUser,lastDay:todayStr}))
        } else if(!freshUser){
          localStorage.removeItem('ms_session')
          setScreen('auth')
        }
      }).catch(()=>{console.log('Background refresh failed, using cached data')})
    }catch(e){
      localStorage.removeItem('ms_session')
    }
  },[])

  const complete=async(profile)=>{
    setLoading(true)
    try{
      // Build a clean user object with only known safe fields
      const updated={
        name:u.name,
        pin:u.pin,
        onboarded:true,
        day:profile._currentDay||1,
        total_days:profile.total_days||75,
        color:profile.color||'#B5365F',
        color_light:profile.color_light||'#FDF0F5',
        why:profile.why||'',
        start_date:profile.start_date||new Date().toDateString(),
        tasks:profile.tasks||{daily:[],weekly:[],general:[]},
        goals:profile.goals||[],
        media_rules:profile.media_rules||[],
        media_challenge_name:profile.media_challenge_name||'no-media challenge',
        groups:[],
        checkins:{},
        weekly_done:{},
        wins:[],
        last_checkin:null,
      }
      await api.updateUser(updated)
      setU(updated)
      setScreen('home')
    }catch(e){
      console.error('onboarding save error:',e)
      alert('Something went wrong saving your profile: '+e.message+'. Please try again!')
    }
    setLoading(false)
  }

  if(loading)return(
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'16px',background:'#fff'}}>
      <div style={{fontSize:'40px'}}>🌸</div>
      <Spinner color="#B5365F"/>
      <div style={{fontSize:'13px',color:'#A898B0',fontFamily:'DM Sans,sans-serif'}}>loading your journey...</div>
    </div>
  )

  if(screen==='auth')return<Auth onLogin={login}/>
  if(screen==='onboarding')return<Onboarding username={me} onComplete={complete}/>
  return<Home u={u} me={me} setU={setU} logout={()=>{setMe(null);setU(null);setScreen('auth');localStorage.removeItem('ms_session')}}/>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').catch(e=>console.log('SW:',e))
  })
}
</script>
</body>
</html>
